[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "eaveswatch"
description = "AI log review that sets itself up: eaves on every host turn logs into templates and alerts, an agent (designed for hobkin, or any harness that meets its contract) reviews what changed against the code. One stdlib-only Python file; S3 or a folder in between."
dynamic = ["version"]   # from eaveswatch.__version__
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frank Lynam" }]
requires-python = ">=3.9"
dependencies = []

keywords = ["security", "logs", "review", "agent", "llm", "ai", "alerts", "s3", "observability", "hobkin"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Logging",
]

[project.optional-dependencies]
hobkin = ["hobkin>=0.5.6"]   # the reviewer harness eaveswatch is designed for

[project.urls]
Homepage = "https://github.com/frank-lynam/eaveswatch"
Issues = "https://github.com/frank-lynam/eaveswatch/issues"

[project.scripts]
eaveswatch = "eaveswatch:cli"

[tool.flit.module]
name = "eaveswatch"

[tool.flit.sdist]
include = ["tests/", "examples/"]
exclude = ["CLAUDE.md", "AGENTS.md"]
