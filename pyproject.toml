[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "hobkin-eaveswatch"
description = "Logs, deploys and connections from every host, joined to the code that made them, for a hobkin to review. One stdlib-only Python file; S3 or a folder in between."
dynamic = ["version"]   # from eaveswatch.__version__
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frank Lynam" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["security", "logs", "review", "agent", "llm", "hobkin", "s3", "observability"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Logging",
]

[project.urls]
Homepage = "https://github.com/frank-lynam/hobkin-eaveswatch"
Issues = "https://github.com/frank-lynam/hobkin-eaveswatch/issues"

[project.scripts]
eaveswatch = "eaveswatch:cli"

[tool.flit.module]
name = "eaveswatch"

[tool.flit.sdist]
include = ["tests/", "chore/", "examples/"]
exclude = ["CLAUDE.md", "AGENTS.md"]
