# Tests on every push; publishing uses PyPI Trusted Publishing (no tokens stored):
# publishing a GitHub release (tag vX.Y.Z, matching eaveswatch.__version__) uploads to PyPI.
name: Publish

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the oldest supported (RHEL 9's); ubuntu-latest no longer has it
          - {python: "3.9", os: ubuntu-24.04}
          - {python: "3.12", os: ubuntu-latest}
          - {python: "3.14", os: ubuntu-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tests/test_eaveswatch.py

  build:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the release tag matches __version__
        run: |
          version=$(python -c 'import eaveswatch; print(eaveswatch.__version__)')
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match eaveswatch.__version__ $version"; exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/eaveswatch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
